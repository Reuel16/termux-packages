name: Generate AlphaCode bootstrap (aarch64)

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    if: github.repository == 'Reuel16/termux-packages'
    steps:
      - name: Git clone
        uses: actions/checkout@v7
      - name: Create bootstrap archive
        run: ./scripts/generate-bootstraps.sh --architectures aarch64
      - name: Store artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-archives-aarch64-${{ github.sha }}
          path: "*.zip"
