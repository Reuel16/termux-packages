name: Generate AlphaCode bootstrap (aarch64)

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    if: github.repository == 'Reuel16/termux-packages'
    steps:
      - name: Git clone
        uses: actions/checkout@v7
      - name: Create bootstrap archive
        run: ./scripts/generate-bootstraps.sh --architectures aarch64
      - name: Store artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-archives-aarch64-${{ github.sha }}
          path: "*.zip"
  publish:
    permissions:
      contents: write
    needs: build
    if: github.repository == 'Reuel16/termux-packages'
    runs-on: ubuntu-slim
    steps:
      - name: Git clone
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch bootstrap archives
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: ./
      - name: Create new tag
        id: get_tag
        run: |
          new_tag="bootstrap-$(date "+%Y.%m.%d")"
          existing_tag_revision=$(git tag | grep "$new_tag" | sort -r | head -n 1 | cut -d- -f3 | cut -dr -f2)
          if [ -n "$existing_tag_revision" ]; then
            tag_rev=$((existing_tag_revision + 1))
          else
            tag_rev=1
          fi
          new_tag="${new_tag}-r${tag_rev}+apt.android-7-alphacode"
          echo "tag_name=$new_tag" >> $GITHUB_OUTPUT
      - name: Publish bootstrap zips to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.get_tag.outputs.tag_name }} --title "AlphaCode bootstrap archives (aarch64, apt.android-7)"
          for file in *.zip; do
            gh release upload ${{ steps.get_tag.outputs.tag_name }} "$file"
          done
